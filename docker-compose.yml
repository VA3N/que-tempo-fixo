version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_meteo
    environment:
      POSTGRES_USER: meteo_user
      POSTGRES_PASSWORD: meteo_password
      POSTGRES_DB: meteo_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: